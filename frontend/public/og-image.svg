<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Territory grid decoration (top-right) -->
  <rect x="780" y="40" width="90" height="90" fill="#c0392b" opacity="0.7" rx="10"/>
  <rect x="880" y="40" width="90" height="90" fill="#c0392b" opacity="0.7" rx="10"/>
  <rect x="980" y="40" width="90" height="90" fill="#c0392b" opacity="0.5" rx="10"/>
  <rect x="780" y="140" width="90" height="90" fill="#c0392b" opacity="0.5" rx="10"/>
  <rect x="880" y="140" width="90" height="90" fill="#2271b3" opacity="0.7" rx="10"/>
  <rect x="980" y="140" width="90" height="90" fill="#2271b3" opacity="0.7" rx="10"/>
  <rect x="780" y="240" width="90" height="90" fill="#2271b3" opacity="0.4" rx="10"/>
  <rect x="880" y="240" width="90" height="90" fill="#2271b3" opacity="0.7" rx="10"/>
  <rect x="980" y="240" width="90" height="90" fill="#2271b3" opacity="0.7" rx="10"/>

  <!-- Main title -->
  <text x="80" y="200" font-family="Arial Black, Arial" font-weight="900" font-size="96"
    fill="white" letter-spacing="8">WORD</text>
  <text x="80" y="310" font-family="Arial Black, Arial" font-weight="900" font-size="96"
    fill="white" letter-spacing="8">TERRITORY</text>

  <!-- Tagline -->
  <text x="80" y="390" font-family="Arial, sans-serif" font-size="32"
    fill="#aaaaaa" letter-spacing="2">A spatial strategy word game</text>

  <!-- Feature pills -->
  <rect x="80" y="440" width="200" height="44" fill="#c0392b" opacity="0.8" rx="22"/>
  <text x="180" y="468" font-family="Arial" font-weight="700" font-size="18"
    fill="white" text-anchor="middle">Daily Challenge</text>

  <rect x="296" y="440" width="200" height="44" fill="#2271b3" opacity="0.8" rx="22"/>
  <text x="396" y="468" font-family="Arial" font-weight="700" font-size="18"
    fill="white" text-anchor="middle">Territory Control</text>

  <rect x="512" y="440" width="180" height="44" fill="#555" opacity="0.8" rx="22"/>
  <text x="602" y="468" font-family="Arial" font-weight="700" font-size="18"
    fill="white" text-anchor="middle">Combo Moves</text>

  <!-- URL -->
  <text x="80" y="580" font-family="Arial" font-size="24" fill="#666666">wordterritory.com</text>

  <!-- Day indicator -->
  <text x="1120" y="600" font-family="Arial Black" font-weight="900" font-size="18"
    fill="#444444" text-anchor="end">Play free · No account needed</text>
</svg>
